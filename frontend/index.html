<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <meta name="theme-color" content="#f2f3f0">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Matma po kolei">
    <title>Matma po kolei</title>
    <meta name="description" content="Przygotowanie do matury z matematyki: zadania z arkuszy CKE na mapie tematów, powtórki w odpowiednich odstępach i Dyżurny, który pomaga przy rozwiązaniach.">
    <meta property="og:title" content="Matma po kolei">
    <meta property="og:description" content="Przygotowanie do matury z matematyki: zadania z arkuszy CKE na mapie tematów, powtórki w odpowiednich odstępach i Dyżurny, który pomaga przy rozwiązaniach.">
    <meta property="og:image" content="https://matmapokolei.pl/icon-512.png">
    <meta property="og:url" content="https://matmapokolei.pl/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pl_PL">
    <script>
      // Motyw przed pierwszym malowaniem, żeby strona nie mignęła w innych kolorach. Strony ze
      // stałym wyglądem pomija ta sama reguła co w App.vue, która potem ustawia resztę.
      try {
        if (
          !/^\/(wizytowka3?|ankieta|style|logowanie|rejestracja|platnosc|potwierdz-adres|nie-pamietam-hasla|nowe-haslo)(\/|$)/.test(
            location.pathname,
          )
        ) {
          const dark =
            !/^\/panel(\/|$)/.test(location.pathname) && localStorage.getItem('motyw') === 'dark'
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          if (dark) {
            const shade = localStorage.getItem('odcien-motywu')
            document.documentElement.dataset.shade =
              shade === 'black' || shade === 'grey' ? shade : 'navy'
          }
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
