<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <meta name="theme-color" content="#f2f3f0">
    <title></title>
    <script>
      // Ciemny motyw przed pierwszym malowaniem, żeby strona nie mignęła na jasno. Strony ze
      // stałym wyglądem pomija ta sama reguła co w App.vue, która potem ustawia resztę.
      try {
        if (
          localStorage.getItem('motyw') === 'dark' &&
          !/^\/(wizytowka3?|panel|logowanie|rejestracja|platnosc|potwierdz-adres|nie-pamietam-hasla|nowe-haslo)(\/|$)/.test(
            location.pathname,
          )
        ) {
          document.documentElement.dataset.theme = 'dark'
          const shade = localStorage.getItem('odcien-motywu')
          document.documentElement.dataset.shade =
            shade === 'black' || shade === 'navy' ? shade : 'grey'
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
