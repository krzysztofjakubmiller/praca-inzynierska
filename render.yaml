services:
  - type: web
    name: matma-api
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Dane startowe tylko dopisują brakujące wiersze, więc mogą iść przy każdym wdrożeniu.
    preDeployCommand: alembic upgrade head && python -m app.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    domains:
      - api.matmapokolei.pl
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: DATABASE_URL
        fromDatabase:
          name: matma-db
          property: connectionString
      - key: ACCESS_PASSWORD
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://matmapokolei.pl,https://matma-web.onrender.com

  - type: web
    name: matma-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    domains:
      - matmapokolei.pl
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: VITE_API_URL
        value: https://api.matmapokolei.pl
    routes:
      # Adresy stron obsługuje router Vue, więc serwer zwraca index.html dla każdej ścieżki
      # bez własnego pliku.
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: matma-db
    region: frankfurt
    plan: 0.1c-256mb
    databaseName: matma
    user: matma
    postgresMajorVersion: "17"
